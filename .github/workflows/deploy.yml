name: Deploy backend
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: projectgrader
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: projectgrader/oop-autograder-api:${{ github.sha }}
          # Dockerfile curls these during build into /app. A Container App env var is too late.
          # Repository secrets (public GitHub Release asset URLs):
          # PRACTICE_BUNDLE_URL, LECTURER_BULK_BUNDLE_URL
          build-args: |
            PRACTICE_BUNDLE_URL=${{ secrets.PRACTICE_BUNDLE_URL }}
            LECTURER_BULK_BUNDLE_URL=${{ secrets.LECTURER_BULK_BUNDLE_URL }}
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - run: >
          az containerapp update -n oop-autograder-api -g rg-oop-autograder
          --image projectgrader/oop-autograder-api:${{ github.sha }}