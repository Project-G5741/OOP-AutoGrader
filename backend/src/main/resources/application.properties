spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=120000
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
app.storage.submission-base-dir=${SUBMISSION_BASE_DIR}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

app.grading.parallelism=4
app.compile.parallelism=4
app.grading.rubric-cache-ttl-minutes=30
app.grading.timing-log=true
app.grading.testcase-invoke-timeout-seconds=5
app.grading.ot-batch-parallelism=${OT_BATCH_PARALLELISM:0}
app.grading.worker-xmx=${WORKER_XMX:64m}
app.grading.worker-max-metaspace=${WORKER_MAX_METASPACE:48m}
app.grading.worker-jar=${WORKER_JAR:/app/worker.jar}
app.grading.worker-java=${WORKER_JAVA:java}
app.grading.sandbox.enabled=${SANDBOX_ENABLED:false}
app.grading.sandbox.runner-url=${SANDBOX_RUNNER_URL:}
app.grading.sandbox.runner-token=${SANDBOX_RUNNER_TOKEN:}
app.master-data-cache-ttl-minutes=60
app.master-data-cache-max-size=1
app.analytics.lecturer-overview-cache-ttl-seconds=90
app.analytics.dashboard-cache-ttl-seconds=180
app.analytics.dashboard-cache-max-size=256
app.analytics.lab-statistics-cache-ttl-seconds=120
app.analytics.lab-statistics-cache-max-size=512
app.upload.access-cache-ttl-seconds=30
app.upload.access-cache-max-size=4096
app.cache.sweep-interval-ms=30000
# Writes (upload, save) stay tight. Auth has its own IP lane for shared Wi‑Fi.
# Reads are higher because one screen fans out into many GETs (lecturer dashboard ~13).
# POST, PUT, PATCH, DELETE (authenticated / non-auth API)
app.burst.max-requests=${APP_BURST_MAX_REQUESTS:5}
# GET, HEAD
app.burst.max-reads=${APP_BURST_MAX_READS:30}
# /api/auth/** only — higher IP budget so a lab on shared Wi‑Fi can log in together
app.burst.max-auth-requests=${APP_BURST_MAX_AUTH_REQUESTS:30}
app.burst.window-seconds=${APP_BURST_WINDOW_SECONDS:10}
app.burst.retry-after-seconds=${APP_BURST_RETRY_AFTER_SECONDS:5}
app.burst.max-keys=${APP_BURST_MAX_KEYS:10000}
# Trust Render/proxy forwarded headers so anonymous burst keys use the client IP.
server.forward-headers-strategy=framework

# Neon connection is configured via datasource properties.
# No ORM or schema migration layer is enabled.
