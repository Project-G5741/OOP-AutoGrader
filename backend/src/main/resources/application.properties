spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
app.storage.submission-base-dir=${SUBMISSION_BASE_DIR}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

app.grading.parallelism=4
app.compile.parallelism=4
app.grading.rubric-cache-ttl-minutes=30
app.grading.timing-log=true
app.grading.testcase-invoke-timeout-seconds=5
app.master-data-cache-ttl-minutes=60
app.analytics.lecturer-overview-cache-ttl-seconds=90
app.analytics.dashboard-cache-ttl-seconds=180
app.analytics.lab-statistics-cache-ttl-seconds=120

# Neon connection is configured via datasource properties.
# No ORM or schema migration layer is enabled.
