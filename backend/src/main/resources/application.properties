spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:5}
# Sleep-friendly defaults for Railway Serverless: drop to zero idle sockets so outbound
# Neon keepalives do not reset the ~10m inactivity timer. Override for always-on hosts
# that prefer warm pool (e.g. HIKARI_MINIMUM_IDLE=2, HIKARI_KEEPALIVE_TIME=120000).
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:0}
spring.datasource.hikari.idle-timeout=${HIKARI_IDLE_TIMEOUT:10000}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME:0}
spring.datasource.hikari.data-source-properties.socketTimeout=30
spring.datasource.hikari.data-source-properties.tcpKeepAlive=${HIKARI_TCP_KEEPALIVE:false}
spring.datasource.hikari.data-source-properties.reWriteBatchedInserts=true
# Let Postgres cast VARCHAR-mapped Java enums into native enum columns under batched inserts.
spring.datasource.hikari.data-source-properties.stringtype=unspecified
app.storage.submission-base-dir=${SUBMISSION_BASE_DIR}
# Deadline emails: default hourly so idle windows can reach Railway's sleep threshold.
# When the replica is asleep the job does not run until the next wake. Disable with
# APP_DEADLINE_REMINDER_ENABLED=false (or move to an external cron that starts/exits).
app.deadline-reminder.enabled=${APP_DEADLINE_REMINDER_ENABLED:true}
app.deadline-reminder.fixed-rate-ms=${APP_DEADLINE_REMINDER_FIXED_RATE_MS:3600000}

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

app.grading.parallelism=${APP_GRADING_PARALLELISM:2}
app.compile.parallelism=${APP_COMPILE_PARALLELISM:2}
app.grading.rubric-cache-ttl-minutes=2
app.grading.rubric-cache-max-size=8
app.grading.timing-log=true
app.grading.testcase-invoke-timeout-seconds=5
app.grading.ot-batch-parallelism=${OT_BATCH_PARALLELISM:0}
app.grading.worker-xmx=${WORKER_XMX:64m}
app.grading.worker-max-metaspace=${WORKER_MAX_METASPACE:48m}
app.grading.worker-jar=${WORKER_JAR:/app/worker.jar}
app.grading.worker-java=${WORKER_JAVA:java}
app.grading.worker-idle-ttl-ms=${WORKER_IDLE_TTL_MS:0}
app.grading.dry-run-compile-idle-ttl-ms=${DRY_RUN_COMPILE_IDLE_TTL_MS:5000}
app.grading.sandbox.enabled=${SANDBOX_ENABLED:false}
app.grading.sandbox.runner-url=${SANDBOX_RUNNER_URL:}
app.grading.sandbox.runner-token=${SANDBOX_RUNNER_TOKEN:}
app.master-data-cache-ttl-minutes=5
app.master-data-cache-max-size=1
app.analytics.lecturer-overview-cache-ttl-seconds=30
app.analytics.dashboard-cache-ttl-seconds=60
app.analytics.dashboard-cache-max-size=32
app.analytics.lab-statistics-cache-ttl-seconds=30
app.analytics.lab-statistics-cache-max-size=64
app.submission.daily-max-per-student=30

app.submission.retention.enabled=true
app.submission.retention.max-per-student=1
app.submission.retention.max-per-lab=1
app.submission.retention.nightly-batch-pairs=200
# After deploy/restart, async trim of all (user, lab) pairs over the cap (existing Neon rows).
app.submission.retention.backfill-on-startup=true
app.upload.access-cache-ttl-seconds=10
app.upload.access-cache-max-size=256
app.cache.sweep-interval-ms=30000
# Writes (upload, save) stay tight. Auth has its own IP lane for shared Wi‑Fi.
# Reads are higher because one screen fans out into many GETs (lecturer dashboard ~13).
# POST, PUT, PATCH, DELETE (authenticated / non-auth API)
app.burst.max-requests=${APP_BURST_MAX_REQUESTS:8}
# GET, HEAD
app.burst.max-reads=${APP_BURST_MAX_READS:20}
# /api/auth/** only — higher IP budget so a lab on shared Wi‑Fi can log in together
app.burst.max-auth-requests=${APP_BURST_MAX_AUTH_REQUESTS:30}
app.burst.window-seconds=${APP_BURST_WINDOW_SECONDS:5}
app.burst.retry-after-seconds=${APP_BURST_RETRY_AFTER_SECONDS:5}
app.burst.max-keys=${APP_BURST_MAX_KEYS:10000}
# Trust Render/proxy forwarded headers so anonymous burst keys use the client IP.
server.forward-headers-strategy=framework

# Neon connection is configured via datasource properties.
# No ORM or schema migration layer is enabled.
