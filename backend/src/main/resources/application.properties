spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
app.storage.submission-base-dir=${SUBMISSION_BASE_DIR}

app.grading.parallelism=4
app.grading.rubric-cache-ttl-minutes=30
app.grading.timing-log=false

# Neon connection is configured via datasource properties.
# No ORM or schema migration layer is enabled.
