spring:
  config:
    activate:
      on-profile: desktop
  datasource:
    url: jdbc:h2:file:${app.desktop.install-dir}/data/desktop-db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

jwt:
  secret: ${JWT_SECRET:desktop-local-dev-secret-minimum-32-bytes!!}

server:
  port: ${DESKTOP_SERVER_PORT:18002}

app:
  desktop:
    install-dir: ${APP_DESKTOP_HOME:.}
    ui-dir: ${APP_DESKTOP_HOME:.}/ui/dist-desktop
    pack-dir: ${APP_DESKTOP_HOME:.}/rubric
  storage:
    submission-base-dir: ${APP_DESKTOP_HOME:.}/data/submissions
  grading:
    worker-jar: ${APP_DESKTOP_HOME:.}/worker.jar
    worker-java: ${DESKTOP_WORKER_JAVA:java}
