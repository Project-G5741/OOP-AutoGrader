spring:
  config:
    import: optional:dotenv:.env
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8002}

google:
  client-id: ${GOOGLE_CLIENT_ID:}

allowed-domain: eiu.edu.vn

jwt:
  secret: ${JWT_SECRET}
  validity-seconds: 3600

desktop:
  pack:
    # Base64 PKCS#8 Ed25519 private key; must pair with classpath desktop-pack-public.key
    signing-private-key: ${DESKTOP_PACK_SIGNING_PRIVATE_KEY:}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

app:
  desktop:
    student-practice:
      backend-jar: ${STUDENT_PRACTICE_BACKEND_JAR:target/backend-1.0.0.jar}
      worker-jar: ${STUDENT_PRACTICE_WORKER_JAR:target/backend-1.0.0-worker.jar}
      ui-dir: ${STUDENT_PRACTICE_UI_DIR:../frontend/dist-desktop}
      launcher-dir: ${STUDENT_PRACTICE_LAUNCHER_DIR:../desktop/launcher/publish}
  mail:
    provider: ${MAIL_PROVIDER:smtp}
    from: ${MAIL_FROM:projectg5741@gmail.com}
    from-name: ${MAIL_FROM_NAME:OOP AutoGrader}
    brevo:
      api-key: ${BREVO_API_KEY:}
  password-reset:
    expiry-minutes: 15
    frontend-url: ${RESET_FRONTEND_URL:${FRONTEND_URL:http://localhost:5173}}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}

