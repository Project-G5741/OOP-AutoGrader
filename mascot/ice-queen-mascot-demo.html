<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Mascot 2.5D - Ice Queen (Nữ Thần Băng)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(148, 163, 184, 0.15);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    [data-theme="light"] {
      --bg: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(203, 213, 225, 0.6);
      --text: #0f172a;
      --text-sub: #64748b;
      --accent: #0284c7;
      --accent-glow: rgba(2, 132, 199, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
      padding: 24px;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      max-width: 680px;
      width: 100%;
    }

    header {
      text-align: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .badge {
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* Stage */
    .stage {
      position: relative;
      width: 320px;
      height: 320px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      box-shadow: 0 20px 40px -15px var(--accent-glow);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: crosshair;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .stage:hover {
      box-shadow: 0 25px 50px -12px var(--accent-glow);
    }

    .halo {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
      filter: blur(20px);
      animation: pulse 4s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 0.9; }
    }

    /* Mascot Sprite */
    .mascot {
      width: 240px;
      height: 240px;
      position: relative;
      z-index: 2;
      background-repeat: no-repeat;
      background-size: 300% 300%;
      image-rendering: -webkit-optimize-contrast;
      transition: transform 0.08s ease-out;
    }

    .stage:active .mascot {
      transform: scale(0.94);
    }

    /* Controls & HUD */
    .hud {
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pill strong {
      color: var(--text);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    button:hover {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
      transform: translateY(-1px);
    }

    /* Reactions Grid Palette */
    .reaction-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 500px;
    }

    .rx-btn {
      padding: 6px 10px;
      font-size: 0.8rem;
      border-radius: 8px;
    }

    .rx-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      background: rgba(15, 23, 42, 0.9);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>
        Ice Queen <span class="badge">Interactive 2.5D</span>
      </h1>
      <p class="subtitle">Di chuyển chuột để mắt và đầu nhìn theo · Bấm vào nhân vật để xem biểu cảm</p>
    </header>

    <div class="stage" id="stage">
      <div class="halo"></div>
      <div class="mascot" id="mascot"></div>
    </div>

    <div class="hud">
      <div class="pill">Hướng: <strong id="dirLabel">Chính diện (Center)</strong></div>
      <div class="pill">Góc θ: <strong id="angleLabel">0°</strong></div>
      <div class="pill">Trạng thái: <strong id="statusLabel">Tracking chuột</strong></div>
    </div>

    <div class="reaction-bar">
      <button class="rx-btn" onclick="triggerReaction(0, 'Nhắm mắt / Thiền định (Blink)')">🧘 Blink</button>
      <button class="rx-btn" onclick="triggerReaction(1, 'Trái tim băng (Heart)')">💙 Heart</button>
      <button class="rx-btn" onclick="triggerReaction(2, 'Hoa tuyết lấp lánh (Sparkle)')">❄️ Sparkle</button>
      <button class="rx-btn" onclick="triggerReaction(3, 'Ngạc nhiên (Surprised)')">❗ Surprised</button>
      <button class="rx-btn" onclick="triggerReaction(4, 'Nháy mắt tinh nghịch (Wink)')">😉 Wink</button>
      <button class="rx-btn" onclick="triggerReaction(5, 'Liếc nhìn lạnh lùng (Side Glance)')">😒 Side Eye</button>
      <button class="rx-btn" onclick="triggerReaction(6, 'Gối đầu ngủ say (Sleepy)')">💤 Sleepy</button>
      <button class="rx-btn" onclick="triggerReaction(7, 'Mắt xoắn ốc chóng mặt (Dizzy)')">🌀 Dizzy</button>
      <button class="rx-btn" onclick="triggerReaction(8, 'Bùng nổ pha lê băng (Burst)')">✨ Radiant</button>
    </div>

    <div class="btn-group">
      <button onclick="toggleTheme()">🌓 Đổi Theme Sáng / Tối</button>
      <button onclick="resumeTracking()">🎯 Tiếp tục theo dõi chuột</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const mascot = document.getElementById('mascot');
    const stage = document.getElementById('stage');
    const dirLabel = document.getElementById('dirLabel');
    const angleLabel = document.getElementById('angleLabel');
    const statusLabel = document.getElementById('statusLabel');
    const toast = document.getElementById('toast');

    const DIR_IMG = 'ice-queen-directions.webp';
    const REACT_IMG = 'ice-queen-reactions.webp';

    // Grid coordinates: col: 0%, 50%, 100%; row: 0%, 50%, 100%
    const POSITIONS = [
      ['0% 0%',   '50% 0%',   '100% 0%'],   // Row 0: NW, N, NE
      ['0% 50%',  '50% 50%',  '100% 50%'],  // Row 1: W, Center, E
      ['0% 100%', '50% 100%', '100% 100%']  // Row 2: SW, S, SE
    ];

    const DIR_NAMES = {
      '0,0': 'Tây Bắc (NW)',
      '0,1': 'Bắc (N - Nhìn lên)',
      '0,2': 'Đông Bắc (NE)',
      '1,0': 'Tây (W - Nhìn trái)',
      '1,1': 'Chính diện (Center)',
      '1,2': 'Đông (E - Nhìn phải)',
      '2,0': 'Tây Nam (SW)',
      '2,1': 'Nam (S - Nhìn xuống)',
      '2,2': 'Đông Nam (SE)'
    };

    let isReacting = false;
    let reactionTimer = null;
    let clickRxIndex = 0;

    // Initialize direction center
    function setDirection(row, col) {
      if (isReacting) return;
      mascot.style.backgroundImage = `url('${DIR_IMG}')`;
      mascot.style.backgroundPosition = POSITIONS[row][col];
      dirLabel.textContent = DIR_NAMES[`${row},${col}`] || 'Center';
    }

    setDirection(1, 1);

    // Mouse Tracking Math (from Section 1.2 of MASCOT_GENERATION_GUIDE.md)
    window.addEventListener('mousemove', (e) => {
      if (isReacting) return;

      const rect = stage.getBoundingClientRect();
      const mascotCenterX = rect.left + rect.width / 2;
      const mascotCenterY = rect.top + rect.height / 2;

      const dx = e.clientX - mascotCenterX;
      const dy = e.clientY - mascotCenterY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const angle = Math.atan2(dy, dx); // [-PI, PI]
      const deg = Math.round((angle * 180) / Math.PI);
      angleLabel.textContent = `${deg}°`;

      // Deadzone threshold for looking center
      const DEADZONE = 55;
      if (dist < DEADZONE) {
        setDirection(1, 1);
        return;
      }

      // 8 compass sectors (PI/8 = 22.5 deg intervals)
      const PI = Math.PI;
      let r = 1, c = 1;

      if (angle >= -7 * PI / 8 && angle < -5 * PI / 8) {
        // NW
        r = 0; c = 0;
      } else if (angle >= -5 * PI / 8 && angle < -3 * PI / 8) {
        // N
        r = 0; c = 1;
      } else if (angle >= -3 * PI / 8 && angle < -PI / 8) {
        // NE
        r = 0; c = 2;
      } else if (angle >= -PI / 8 && angle < PI / 8) {
        // E
        r = 1; c = 2;
      } else if (angle >= PI / 8 && angle < 3 * PI / 8) {
        // SE
        r = 2; c = 2;
      } else if (angle >= 3 * PI / 8 && angle < 5 * PI / 8) {
        // S
        r = 2; c = 1;
      } else if (angle >= 5 * PI / 8 && angle < 7 * PI / 8) {
        // SW
        r = 2; c = 0;
      } else {
        // W
        r = 1; c = 0;
      }

      setDirection(r, c);
    });

    // Trigger Reaction by index (0..8)
    function triggerReaction(idx, label) {
      isReacting = true;
      if (reactionTimer) clearTimeout(reactionTimer);

      const r = Math.floor(idx / 3);
      const c = idx % 3;

      mascot.style.backgroundImage = `url('${REACT_IMG}')`;
      mascot.style.backgroundPosition = POSITIONS[r][c];

      statusLabel.textContent = `Phản ứng: ${label || ('RX ' + idx)}`;
      showToast(`✨ ${label || 'Phản ứng ' + idx}`);

      // Auto revert back after 2.4s
      reactionTimer = setTimeout(() => {
        resumeTracking();
      }, 2400);
    }

    function resumeTracking() {
      if (reactionTimer) clearTimeout(reactionTimer);
      isReacting = false;
      statusLabel.textContent = 'Tracking chuột';
      setDirection(1, 1);
      showToast('🎯 Đã kích hoạt lại theo dõi chuột');
    }

    // Stage Click Boop
    stage.addEventListener('click', () => {
      const rxNames = [
        'Nhắm mắt / Thiền định (Blink)',
        'Trái tim băng (Heart)',
        'Hoa tuyết lấp lánh (Sparkle)',
        'Ngạc nhiên (Surprised)',
        'Nháy mắt tinh nghịch (Wink)',
        'Liếc nhìn lạnh lùng (Side Glance)',
        'Gối đầu ngủ say (Sleepy)',
        'Mắt xoắn ốc chóng mặt (Dizzy)',
        'Bùng nổ pha lê băng (Burst)'
      ];
      triggerReaction(clickRxIndex, rxNames[clickRxIndex]);
      clickRxIndex = (clickRxIndex + 1) % 9;
    });

    // Theme Toggle
    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      const next = current === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', next);
      showToast(`Chuyển sang ${next === 'light' ? 'Chế độ Sáng' : 'Chế độ Tối'}`);
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }
  </script>
</body>
</html>
