<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Mascot 2.5D - Cún Bông Kem Dâu (Strawberry Cream Pomeranian)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.72);
      --card-border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #f9a8d4;
    }
    [data-theme="light"] {
      --bg: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(203, 213, 225, 0.65);
      --text: #0f172a;
      --text-sub: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: background 0.3s ease, color 0.3s ease; padding: 24px;
    }
    .container { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 680px; width: 100%; }
    header { text-align: center; }
    h1 { font-size: 1.7rem; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .badge {
      font-size: 0.75rem; font-weight: 700; padding: 3px 10px; border-radius: 9999px;
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    p.subtitle { color: var(--text-sub); font-size: 0.92rem; }
    .stage {
      position: relative; width: 320px; height: 320px; background: var(--card-bg);
      border: 1px solid var(--card-border); border-radius: 24px;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.35);
      display: flex; align-items: center; justify-content: center; cursor: crosshair;
    }
    .mascot {
      width: 240px; height: 240px; position: relative; z-index: 2;
      background-repeat: no-repeat; background-size: 300% 300%;
      transition: transform 0.08s ease-out;
    }
    .stage:active .mascot { transform: scale(0.94); }
    .hud { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
    .pill {
      background: var(--card-bg); border: 1px solid var(--card-border);
      padding: 6px 14px; border-radius: 12px; font-size: 0.84rem; color: var(--text-sub);
    }
    .pill strong { color: var(--text); }
    .btn-group { display: flex; gap: 8px; }
    button {
      background: var(--card-bg); color: var(--text); border: 1px solid var(--card-border);
      padding: 8px 14px; border-radius: 12px; font-size: 0.84rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s ease;
    }
    button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .reaction-bar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; max-width: 540px; }
    .rx-btn { padding: 6px 10px; font-size: 0.8rem; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Cún Bông Kem Dâu (Strawberry Cream Pomeranian) <span class="badge">Rare · 4,555 pts</span></h1>
      <p class="subtitle">Di chuyển chuột để mắt và đầu nhìn theo · Bấm vào nhân vật để xem biểu cảm</p>
    </header>
    <div class="stage" id="stage">
      <div class="mascot" id="mascot"></div>
    </div>
    <div class="hud">
      <div class="pill">Hướng: <strong id="dirLabel">Chính diện (Center)</strong></div>
      <div class="pill">Góc θ: <strong id="angleLabel">0°</strong></div>
      <div class="pill">Trạng thái: <strong id="statusLabel">Tracking chuột</strong></div>
    </div>
    <div class="reaction-bar">
      <button class="rx-btn" onclick="triggerReaction(0, 'Đeo kính soi bug (Focus)')">👓 Focus</button>
      <button class="rx-btn" onclick="triggerReaction(1, 'Kèn tiệc & pháo giấy (Celebration)')">🎉 Party</button>
      <button class="rx-btn" onclick="triggerReaction(2, 'Ôm cúp vàng 5 sao (Trophy)')">🏆 Trophy</button>
      <button class="rx-btn" onclick="triggerReaction(3, 'Quyết tâm diệt bug (Battle Cry)')">🔥 Battle</button>
      <button class="rx-btn" onclick="triggerReaction(4, 'Kính râm Pro Coder (Pro Smirk)')">😎 Pro</button>
      <button class="rx-btn" onclick="triggerReaction(5, 'Mắt rực lửa chiến ý (Fire Spirit)')">⚡ Spirit</button>
      <button class="rx-btn" onclick="triggerReaction(6, 'Nạp trà sữa / latte (Boba Break)')">🧋 Boba</button>
      <button class="rx-btn" onclick="triggerReaction(7, 'Hoa mắt quá tải (Glitch Dizzy)')">🌀 Glitch</button>
      <button class="rx-btn" onclick="triggerReaction(8, 'Bùng nổ hào quang Cyan (Rare Burst)')">💎 Burst</button>
    </div>
    <div class="btn-group">
      <button onclick="toggleTheme()">🌓 Đổi Theme Sáng / Tối</button>
      <button onclick="resumeTracking()">🎯 Tiếp tục theo dõi chuột</button>
    </div>
  </div>
  <script>
    const mascot = document.getElementById('mascot');
    const stage = document.getElementById('stage');
    const dirLabel = document.getElementById('dirLabel');
    const angleLabel = document.getElementById('angleLabel');
    const statusLabel = document.getElementById('statusLabel');
    const DIR_IMG = 'pomeranian-directions.webp';
    const REACT_IMG = 'pomeranian-reactions.webp';
    const POSITIONS = [
      ['0% 0%', '50% 0%', '100% 0%'],
      ['0% 50%', '50% 50%', '100% 50%'],
      ['0% 100%', '50% 100%', '100% 100%']
    ];
    const DIR_NAMES = {
      '0,0': 'Tây Bắc (NW)', '0,1': 'Bắc (N)', '0,2': 'Đông Bắc (NE)',
      '1,0': 'Tây (W)', '1,1': 'Chính diện (Center)', '1,2': 'Đông (E)',
      '2,0': 'Tây Nam (SW)', '2,1': 'Nam (S)', '2,2': 'Đông Nam (SE)'
    };
    let isReacting = false, reactionTimer = null, clickRxIndex = 0;
    function setDirection(row, col) {
      if (isReacting) return;
      mascot.style.backgroundImage = `url('${DIR_IMG}')`;
      mascot.style.backgroundPosition = POSITIONS[row][col];
      dirLabel.textContent = DIR_NAMES[`${row},${col}`] || 'Center';
    }
    setDirection(1, 1);
    window.addEventListener('mousemove', (e) => {
      if (isReacting) return;
      const rect = stage.getBoundingClientRect();
      const dx = e.clientX - (rect.left + rect.width / 2);
      const dy = e.clientY - (rect.top + rect.height / 2);
      const dist = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      angleLabel.textContent = `${Math.round((angle * 180) / Math.PI)}°`;
      if (dist < 55) { setDirection(1, 1); return; }
      const PI = Math.PI;
      let r = 1, c = 1;
      if (angle >= -7*PI/8 && angle < -5*PI/8) { r = 0; c = 0; }
      else if (angle >= -5*PI/8 && angle < -3*PI/8) { r = 0; c = 1; }
      else if (angle >= -3*PI/8 && angle < -PI/8) { r = 0; c = 2; }
      else if (angle >= -PI/8 && angle < PI/8) { r = 1; c = 2; }
      else if (angle >= PI/8 && angle < 3*PI/8) { r = 2; c = 2; }
      else if (angle >= 3*PI/8 && angle < 5*PI/8) { r = 2; c = 1; }
      else if (angle >= 5*PI/8 && angle < 7*PI/8) { r = 2; c = 0; }
      else { r = 1; c = 0; }
      setDirection(r, c);
    });
    function triggerReaction(idx, label) {
      isReacting = true;
      if (reactionTimer) clearTimeout(reactionTimer);
      mascot.style.backgroundImage = `url('${REACT_IMG}')`;
      mascot.style.backgroundPosition = POSITIONS[Math.floor(idx / 3)][idx % 3];
      statusLabel.textContent = label;
      reactionTimer = setTimeout(resumeTracking, 2400);
    }
    function resumeTracking() {
      if (reactionTimer) clearTimeout(reactionTimer);
      isReacting = false;
      statusLabel.textContent = 'Tracking chuột';
      setDirection(1, 1);
    }
    stage.addEventListener('click', () => {
      const rxNames = [
        'Đeo kính soi bug (Focus)',
        'Kèn tiệc & pháo giấy (Celebration)',
        'Ôm cúp vàng 5 sao (Trophy)',
        'Quyết tâm diệt bug (Battle Cry)',
        'Kính râm Pro Coder (Pro Smirk)',
        'Mắt rực lửa chiến ý (Fire Spirit)',
        'Nạp trà sữa / latte (Boba Break)',
        'Hoa mắt quá tải (Glitch Dizzy)',
        'Bùng nổ hào quang Cyan (Rare Burst)'
      ];
      triggerReaction(clickRxIndex, rxNames[clickRxIndex]);
      clickRxIndex = (clickRxIndex + 1) % 9;
    });
    function toggleTheme() {
      const cur = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
    }
  </script>
</body>
</html>
