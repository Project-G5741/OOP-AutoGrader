server.port=${PORT:8090}
sandbox.runner.token=${SANDBOX_RUNNER_TOKEN:}
sandbox.runner.image=${SANDBOX_IMAGE:oop-autograder-sandbox-worker:latest}
sandbox.pool.min-warm=${SANDBOX_POOL_MIN:1}
sandbox.pool.max-warm=${SANDBOX_POOL_MAX:4}
sandbox.pool.scale-up-wait-ms=${SANDBOX_POOL_SCALE_UP_WAIT_MS:2000}
sandbox.pool.scale-down-idle-ms=${SANDBOX_POOL_SCALE_DOWN_IDLE_MS:60000}
sandbox.pool.warm-on-start=${SANDBOX_POOL_WARM_ON_START:true}
sandbox.session.max-tarball-bytes=${SANDBOX_MAX_TARBALL_BYTES:10485760}
sandbox.session.ttl-seconds=${SANDBOX_SESSION_TTL_SECONDS:600}
sandbox.session.max-sessions=${SANDBOX_MAX_SESSIONS:64}
sandbox.session.sweep-interval-ms=${SANDBOX_SESSION_SWEEP_MS:60000}
